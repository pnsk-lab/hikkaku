name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun/MoonBit/Turbo caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install
            ~/.turbo
            **/.turbo
          key: ${{ runner.os }}-bun-moonbit-turbo-${{ hashFiles('bun.lock', 'turbo.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-moonbit-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up MoonBit
        run: |
          # This project still uses moon.mod.json, which newer MoonBit releases reject.
          # Pin a compatible toolchain and core; do not reuse an unversioned cache.
          base='https://github.com/moonbit-community/moonbit-overlay/releases/download/v0.10.9%2B6e6c44045%2Bfc2a4ee'
          curl -fsSL "$base/moonbit-linux-x86_64.tar.gz" -o /tmp/moonbit.tar.gz
          curl -fsSL "$base/moonbit-core.tar.gz" -o /tmp/moonbit-core.tar.gz
          echo '0e81deb35eca29e892415cf954ea42b48a43bcf277ad36a3ae1e97d2d1dfe732  /tmp/moonbit.tar.gz' | sha256sum -c -
          echo 'd92b84ea0bc11ec9a9fe57d313416a6694a5826f4307e8e65d5075079ee913ca  /tmp/moonbit-core.tar.gz' | sha256sum -c -
          mkdir -p "$HOME/.moon/lib"
          tar -xf /tmp/moonbit.tar.gz -C "$HOME/.moon"
          tar -xf /tmp/moonbit-core.tar.gz -C "$HOME/.moon/lib"
          chmod +x "$HOME/.moon/bin/"* "$HOME/.moon/bin/internal/tcc"
          export PATH="$HOME/.moon/bin:$PATH"
          moon -C "$HOME/.moon/lib/core" bundle --warn-list -a --all --quiet
          moon -C "$HOME/.moon/lib/core" bundle --warn-list -a --target wasm-gc --quiet
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun typecheck

      - name: Check generated references
        run: bun run ref:check

      - name: Run tests with coverage
        run: |
          bun run --cwd packages/testing test -- --coverage
          bun run --cwd packages/hikkaku test -- --coverage
          bun run --cwd packages/moonscratch test -- --coverage
          bun run --cwd packages/gobox test -- --coverage
          bun run --cwd packages/minifier test -- --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: hikkaku-ci
          flags: tests
          files: |
            packages/hikkaku/coverage/lcov.info
            packages/testing/coverage/lcov.info
            packages/moonscratch/coverage/lcov.info
            packages/gobox/coverage/lcov.info
            packages/minifier/coverage/lcov.info
          fail_ci_if_error: false
